<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Huda — surah reader prototype (kimi)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">

    <header class="topbar">
      <div class="brand" id="brand"></div>
      <div class="surah-picker" id="surahPicker"></div>
      <div class="top-actions" id="topActions"></div>
    </header>

    <div class="controlbar" id="controlbar">
      <div class="ctrl-label" id="depthLabel"></div>
      <div class="depth-tabs" id="depthTabs" role="group" aria-label="Reading depth"></div>
      <div class="view-toggle" id="viewToggle" role="group" aria-label="View mode"></div>
    </div>

    <main class="main" id="main" tabindex="-1"></main>

    <div id="sheetRoot"></div>

  </div>
</div>
<script src="app.js"></script>
</body>
</html>
