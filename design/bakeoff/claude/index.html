<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Huda reading screen prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="wide.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<main class="phone" id="phone">
  <div class="screen" id="screen">
    <!-- loading skeleton, replaced by app.js -->
    <div class="skeleton" aria-hidden="true">
      <i class="sk sk-title"></i><i class="sk sk-chips"></i><i class="sk sk-card"></i>
      <i class="sk sk-line"></i><i class="sk sk-line short"></i><i class="sk sk-line"></i>
    </div>
  </div>

  <!-- wide screens only (>= 1024px): the reading platform. #scene is moved in here by app.js; #home holds the opening question -->
  <section class="platform" id="platform"><div class="home" id="home"></div></section>

  <div class="scene" id="scene" role="dialog" aria-modal="true" aria-hidden="true" inert>
    <header class="scene-top">
      <button class="pill-btn" id="sceneBack" type="button"></button>
      <div class="pips" id="pips" aria-hidden="true"></div>
      <div class="scene-nav">
        <button class="round-btn" id="scenePrev" type="button"></button>
        <button class="round-btn" id="sceneNext" type="button"></button>
      </div>
    </header>
    <div class="scene-scroll" id="sceneScroll">
      <div class="scene-body" id="sceneBody"></div>
    </div>
  </div>

  <footer class="keybar" id="keybar"></footer>

  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" inert>
    <div class="sheet-head">
      <h2 class="sheet-title" id="sheetTitle"></h2>
      <button class="pill-btn" id="sheetClose" type="button"></button>
    </div>
    <div class="sheet-scroll" id="sheetBody"></div>
  </section>
</main>

<script src="icons.js"></script>
<script src="app.js" defer></script>
</body>
</html>
